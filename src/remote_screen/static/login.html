<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>RemoteScreen 登录</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }
    p.sub {
      margin: 0 0 22px;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
    }
    input[type="password"] {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 22px;
      letter-spacing: 6px;
      text-align: center;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }
    button {
      margin-top: 16px;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #238636;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .error {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      color: #f85149;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>RemoteScreen</h1>
    <p class="sub">输入终端或 Telegram 收到的存取 PIN</p>
    <form id="loginForm">
      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="PIN"
        maxlength="32"
        autofocus
        required
      />
      <button id="submitBtn" type="submit">连接</button>
    </form>
    <div id="errorBox" class="error" role="alert"></div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const pinInput = document.getElementById("pinInput");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("errorBox");
    let lockTimer = null;

    function startLockCountdown(seconds) {
      if (lockTimer) clearInterval(lockTimer);
      let left = Math.max(1, Number(seconds) || 60);
      submitBtn.disabled = true;
      const tick = () => {
        if (left <= 0) {
          clearInterval(lockTimer);
          lockTimer = null;
          submitBtn.disabled = false;
          errorBox.textContent = "";
          return;
        }
        errorBox.textContent = `尝试次数过多，请等待 ${left} 秒后再试`;
        left -= 1;
      };
      tick();
      lockTimer = setInterval(tick, 1000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;
      const pin = pinInput.value.trim();
      if (!pin) {
        errorBox.textContent = "请输入 PIN";
        return;
      }
      errorBox.textContent = "";
      submitBtn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          window.location.replace("/");
          return;
        }
        if (res.status === 429) {
          startLockCountdown(data.retry_after || 60);
          return;
        }
        submitBtn.disabled = false;
        errorBox.textContent = "PIN 不正确，请重试";
        pinInput.select();
      } catch (err) {
        submitBtn.disabled = false;
        errorBox.textContent = "网络异常，请重试";
      }
    });
  </script>
</body>
</html>
