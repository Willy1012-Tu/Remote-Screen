<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>RemoteScreen</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0a0d12;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      position: relative;
    }
    .toolbar-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .toolbar {
      pointer-events: auto;
      width: 100%;
      background: rgba(20, 25, 34, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar.hidden { display: none; }
    .collapse-pill {
      pointer-events: auto;
      margin-top: 2px;
      padding: 2px 14px;
      border-radius: 0 0 10px 10px;
      background: rgba(20, 25, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: none;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      white-space: nowrap;
      padding: 0 4px;
      color: #9ba7b4;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149;
    }
    .dot.online { background: #3fb950; }
    .btn {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #1c2330;
      color: #e6edf3;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn.active {
      background: #1f6feb;
      border-color: #58a6ff;
      color: #ffffff;
    }
    .btn.warn.active {
      background: #9e6a03;
      border-color: #d29922;
    }
    .btn.danger {
      color: #ff7b72;
    }
    .hotkey-bar {
      pointer-events: auto;
      width: 100%;
      background: rgba(17, 22, 30, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      display: none;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hotkey-bar.open { display: flex; }
    .hotkey-bar::-webkit-scrollbar { display: none; }
    .stage {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      position: relative;
      background: #0a0d12;
    }
    #screenImg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }
    .keyboard-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 35;
      background: rgba(20, 25, 34, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px;
      display: none;
      gap: 6px;
      align-items: center;
    }
    .keyboard-bar.open { display: flex; }
    .keyboard-bar input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 15px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .keyboard-bar button {
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      background: #238636;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .keyboard-bar button.sec {
      background: #30363d;
    }
    .ripple {
      position: fixed;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      border-radius: 50%;
      border: 2px solid #58a6ff;
      background: rgba(88, 166, 255, 0.25);
      pointer-events: none;
      z-index: 40;
      animation: rippleOut 0.35s ease-out forwards;
    }
    .ripple.right {
      border-color: #d29922;
      background: rgba(210, 153, 34, 0.25);
    }
    @keyframes rippleOut {
      from { transform: scale(0.5); opacity: 1; }
      to { transform: scale(1.7); opacity: 0; }
    }
    .toast {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar-wrap">
      <div id="toolbar" class="toolbar">
        <span class="status"><span id="connDot" class="dot"></span><span id="connText">连接中</span></span>
        <button class="btn mode-btn active" data-mode="click">点击</button>
        <button class="btn mode-btn" data-mode="drag">拖拽</button>
        <button class="btn mode-btn" data-mode="scroll">滚轮</button>
        <button id="rightBtn" class="btn warn">右键</button>
        <button id="kbdToggleBtn" class="btn">键盘</button>
        <button id="hotkeyToggleBtn" class="btn">快捷键</button>
        <button id="qualityBtn" class="btn">标准</button>
        <button id="refreshBtn" class="btn">刷新</button>
        <button id="resetViewBtn" class="btn">复位</button>
        <button id="logoutBtn" class="btn danger">退出</button>
      </div>
      <div id="hotkeyBar" class="hotkey-bar">
        <button class="btn hk" data-keys="enter">Enter</button>
        <button class="btn hk" data-keys="backspace">退格</button>
        <button class="btn hk" data-keys="esc">Esc</button>
        <button class="btn hk" data-keys="tab">Tab</button>
        <button class="btn hk" data-keys="ctrl,c">Ctrl+C</button>
        <button class="btn hk" data-keys="ctrl,v">Ctrl+V</button>
        <button class="btn hk" data-keys="win">Win</button>
        <button class="btn hk" data-keys="alt,tab">Alt+Tab</button>
        <button class="btn hk" data-keys="up">↑</button>
        <button class="btn hk" data-keys="down">↓</button>
        <button class="btn hk" data-keys="left">←</button>
        <button class="btn hk" data-keys="right">→</button>
      </div>
      <button id="collapsePill" class="collapse-pill" title="收起/展开工具栏">▴</button>
    </div>

    <div id="stage" class="stage">
      <img id="screenImg" alt="远程桌面" draggable="false" />
    </div>

    <div id="keyboardBar" class="keyboard-bar">
      <input id="textInput" type="text" placeholder="输入文字（支持中英文）..." enterkeyhint="send" />
      <button id="sendTextBtn" type="button">发送</button>
      <button id="sendEnterBtn" class="sec" type="button">回车</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const img = document.getElementById("screenImg");
    const toolbar = document.getElementById("toolbar");
    const hotkeyBar = document.getElementById("hotkeyBar");
    const keyboardBar = document.getElementById("keyboardBar");
    const collapsePill = document.getElementById("collapsePill");
    const connDot = document.getElementById("connDot");
    const connText = document.getElementById("connText");
    const rightBtn = document.getElementById("rightBtn");
    const kbdToggleBtn = document.getElementById("kbdToggleBtn");
    const hotkeyToggleBtn = document.getElementById("hotkeyToggleBtn");
    const qualityBtn = document.getElementById("qualityBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const resetViewBtn = document.getElementById("resetViewBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const textInput = document.getElementById("textInput");
    const sendTextBtn = document.getElementById("sendTextBtn");
    const sendEnterBtn = document.getElementById("sendEnterBtn");
    const toast = document.getElementById("toast");

    let ws = null;
    let reconnectDelay = 1000;
    let mode = "click";
    let oneShotRight = false;
    let toolbarCollapsed = false;

    const qualityOrder = [
      { key: "medium", label: "标准" },
      { key: "high", label: "清晰" },
      { key: "low", label: "省流" },
    ];
    let qualityIdx = 0;

    let scale = 1;
    let tx = 0;
    let ty = 0;

    let activeUrl = null;
    const pendingRevoke = [];

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function showRipple(x, y, isRight) {
      const el = document.createElement("div");
      el.className = "ripple" + (isRight ? " right" : "");
      el.style.left = x + "px";
      el.style.top = y + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 380);
    }

    function applyTransform() {
      img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    function resetView() {
      scale = 1;
      tx = 0;
      ty = 0;
      applyTransform();
    }

    function clientToNorm(clientX, clientY) {
      const rect = img.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) {
        return null;
      }
      return {
        x: Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)),
        y: Math.min(1, Math.max(0, (clientY - rect.top) / rect.height)),
      };
    }

    function sendMsg(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
        return true;
      }
      return false;
    }

    img.addEventListener("load", () => {
      while (pendingRevoke.length > 0) {
        URL.revokeObjectURL(pendingRevoke.shift());
      }
    });

    function connectWs() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${window.location.host}/ws`);
      ws.binaryType = "blob";

      ws.onopen = () => {
        reconnectDelay = 1000;
        connDot.classList.add("online");
        connText.textContent = "在线";
      };

      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") {
          try {
            const msg = JSON.parse(ev.data);
            if (msg.type === "error" && msg.message) {
              showToast(msg.message);
            }
          } catch (_) {}
          return;
        }
        if (ev.data instanceof Blob) {
          const nextUrl = URL.createObjectURL(ev.data);
          if (activeUrl) pendingRevoke.push(activeUrl);
          activeUrl = nextUrl;
          img.src = nextUrl;
        }
      };

      ws.onclose = (ev) => {
        connDot.classList.remove("online");
        connText.textContent = "重连中";
        if (ev.code === 4401 || ev.code === 1008) {
          window.location.replace("/login");
          return;
        }
        setTimeout(connectWs, reconnectDelay);
        reconnectDelay = Math.min(5000, reconnectDelay * 2);
      };
    }

    // Toolbar actions
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        mode = btn.dataset.mode;
        document.querySelectorAll(".mode-btn").forEach((b) => b.classList.toggle("active", b === btn));
      });
    });

    rightBtn.addEventListener("click", () => {
      oneShotRight = !oneShotRight;
      rightBtn.classList.toggle("active", oneShotRight);
      showToast(oneShotRight ? "下次点击为右键" : "已取消右键");
    });

    kbdToggleBtn.addEventListener("click", () => {
      const open = !keyboardBar.classList.contains("open");
      keyboardBar.classList.toggle("open", open);
      kbdToggleBtn.classList.toggle("active", open);
      if (open) textInput.focus();
    });

    hotkeyToggleBtn.addEventListener("click", () => {
      const open = !hotkeyBar.classList.contains("open");
      hotkeyBar.classList.toggle("open", open);
      hotkeyToggleBtn.classList.toggle("active", open);
    });

    collapsePill.addEventListener("click", () => {
      toolbarCollapsed = !toolbarCollapsed;
      toolbar.classList.toggle("hidden", toolbarCollapsed);
      if (toolbarCollapsed) {
        hotkeyBar.classList.remove("open");
        hotkeyToggleBtn.classList.remove("active");
      }
      collapsePill.textContent = toolbarCollapsed ? "▾" : "▴";
    });

    qualityBtn.addEventListener("click", () => {
      qualityIdx = (qualityIdx + 1) % qualityOrder.length;
      const q = qualityOrder[qualityIdx];
      qualityBtn.textContent = q.label;
      sendMsg({ type: "quality", preset: q.key });
      showToast(`画质：${q.label}`);
    });

    refreshBtn.addEventListener("click", () => {
      sendMsg({ type: "refresh" });
    });

    resetViewBtn.addEventListener("click", () => {
      resetView();
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" }).catch(() => {});
      window.location.replace("/login");
    });

    document.querySelectorAll(".hk").forEach((btn) => {
      btn.addEventListener("click", () => {
        const keys = btn.dataset.keys.split(",");
        sendMsg({ type: "key", keys });
      });
    });

    function submitText() {
      const value = textInput.value;
      if (!value) return;
      if (sendMsg({ type: "text", text: value })) {
        textInput.value = "";
      }
    }

    sendTextBtn.addEventListener("click", submitText);
    sendEnterBtn.addEventListener("click", () => {
      sendMsg({ type: "key", keys: ["enter"] });
    });
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitText();
      }
    });

    // Touch gesture state
    let touchState = null;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;

    function dist(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    function clearLongPress() {
      if (touchState && touchState.longTimer) {
        clearTimeout(touchState.longTimer);
        touchState.longTimer = null;
      }
    }

    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        clearLongPress();
        if (touchState && touchState.draggingRemote) {
          const norm = clientToNorm(touchState.lastX, touchState.lastY);
          if (norm) sendMsg({ type: "mouse_up", x: norm.x, y: norm.y, button: "left" });
        }
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        touchState = {
          type: "pinch",
          lastDist: dist(t0, t1),
          lastMidX: (t0.clientX + t1.clientX) / 2,
          lastMidY: (t0.clientY + t1.clientY) / 2,
        };
        return;
      }

      if (e.touches.length === 1) {
        const t = e.touches[0];
        const norm = clientToNorm(t.clientX, t.clientY);
        touchState = {
          type: "single",
          startX: t.clientX,
          startY: t.clientY,
          lastX: t.clientX,
          lastY: t.clientY,
          moved: false,
          longFired: false,
          draggingRemote: false,
          scrollAcc: 0,
          lastMoveSent: 0,
          longTimer: null,
        };

        if (mode === "drag" && norm) {
          touchState.draggingRemote = true;
          sendMsg({ type: "mouse_down", x: norm.x, y: norm.y, button: "left" });
        } else if (mode === "click") {
          touchState.longTimer = setTimeout(() => {
            if (!touchState || touchState.moved) return;
            const n = clientToNorm(touchState.startX, touchState.startY);
            if (n) {
              touchState.longFired = true;
              sendMsg({ type: "click", x: n.x, y: n.y, button: "right" });
              showRipple(touchState.startX, touchState.startY, true);
            }
          }, 480);
        }
      }
    }, { passive: false });

    stage.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (!touchState) return;

      if (touchState.type === "pinch" && e.touches.length === 2) {
        const t0 = e.touches[0];
        const t1 = e.touches[1];
        const newDist = dist(t0, t1);
        const midX = (t0.clientX + t1.clientX) / 2;
        const midY = (t0.clientY + t1.clientY) / 2;
        const dmx = midX - touchState.lastMidX;
        const dmy = midY - touchState.lastMidY;
        const rect = img.getBoundingClientRect();

        if (touchState.lastDist > 0 && rect.width > 0) {
          const nextScale = Math.min(4.0, Math.max(1.0, scale * (newDist / touchState.lastDist)));
          const ratio = nextScale / scale;
          tx = tx + (midX - rect.left) * (1 - ratio) + dmx;
          ty = ty + (midY - rect.top) * (1 - ratio) + dmy;
          scale = nextScale;
          if (scale <= 1.01) {
            scale = 1;
            tx = 0;
            ty = 0;
          }
          applyTransform();
        }
        touchState.lastDist = newDist;
        touchState.lastMidX = midX;
        touchState.lastMidY = midY;
        return;
      }

      if (touchState.type === "single" && e.touches.length === 1) {
        const t = e.touches[0];
        const dx = t.clientX - touchState.lastX;
        const dy = t.clientY - touchState.lastY;
        if (Math.hypot(t.clientX - touchState.startX, t.clientY - touchState.startY) > 10) {
          touchState.moved = true;
          clearLongPress();
        }

        if (mode === "drag" && touchState.draggingRemote) {
          const now = performance.now();
          if (now - touchState.lastMoveSent >= 40) {
            const norm = clientToNorm(t.clientX, t.clientY);
            if (norm) {
              sendMsg({ type: "mouse_move", x: norm.x, y: norm.y });
              touchState.lastMoveSent = now;
            }
          }
        } else if (mode === "scroll") {
          touchState.scrollAcc += dy;
          const step = 28;
          while (Math.abs(touchState.scrollAcc) >= step) {
            const dir = touchState.scrollAcc > 0 ? 1 : -1;
            touchState.scrollAcc -= dir * step;
            const norm = clientToNorm(t.clientX, t.clientY);
            if (norm) sendMsg({ type: "scroll", x: norm.x, y: norm.y, delta: dir });
          }
        } else if (mode === "click" && scale > 1.05 && touchState.moved) {
          tx += dx;
          ty += dy;
          applyTransform();
        }

        touchState.lastX = t.clientX;
        touchState.lastY = t.clientY;
      }
    }, { passive: false });

    stage.addEventListener("touchend", (e) => {
      if (!touchState) return;
      clearLongPress();

      if (touchState.type === "pinch") {
        if (e.touches.length === 0) touchState = null;
        return;
      }

      if (touchState.type === "single") {
        const endX = touchState.lastX;
        const endY = touchState.lastY;
        const norm = clientToNorm(endX, endY);

        if (mode === "drag" && touchState.draggingRemote) {
          if (norm) sendMsg({ type: "mouse_up", x: norm.x, y: norm.y, button: "left" });
        } else if (mode === "click" && !touchState.moved && !touchState.longFired && norm) {
          const now = performance.now();
          if (oneShotRight) {
            oneShotRight = false;
            rightBtn.classList.remove("active");
            sendMsg({ type: "click", x: norm.x, y: norm.y, button: "right" });
            showRipple(endX, endY, true);
          } else if (now - lastTapTime < 320 && Math.hypot(endX - lastTapX, endY - lastTapY) < 24) {
            lastTapTime = 0;
            sendMsg({ type: "dblclick", x: norm.x, y: norm.y });
            showRipple(endX, endY, false);
          } else {
            lastTapTime = now;
            lastTapX = endX;
            lastTapY = endY;
            sendMsg({ type: "click", x: norm.x, y: norm.y, button: "left" });
            showRipple(endX, endY, false);
          }
        }
      }
      if (e.touches.length === 0) touchState = null;
    });

    stage.addEventListener("touchcancel", () => {
      clearLongPress();
      if (touchState && touchState.draggingRemote) {
        const norm = clientToNorm(touchState.lastX, touchState.lastY);
        if (norm) sendMsg({ type: "mouse_up", x: norm.x, y: norm.y, button: "left" });
      }
      touchState = null;
    });

    // Desktop mouse fallback for browser testing
    let mouseDownActive = false;
    stage.addEventListener("mousedown", (e) => {
      if (e.button === 2) return;
      const norm = clientToNorm(e.clientX, e.clientY);
      if (!norm) return;
      if (mode === "drag") {
        mouseDownActive = true;
        sendMsg({ type: "mouse_down", x: norm.x, y: norm.y, button: "left" });
      } else if (mode === "click") {
        const btn = oneShotRight ? "right" : "left";
        if (oneShotRight) {
          oneShotRight = false;
          rightBtn.classList.remove("active");
        }
        sendMsg({ type: "click", x: norm.x, y: norm.y, button: btn });
        showRipple(e.clientX, e.clientY, btn === "right");
      }
    });
    stage.addEventListener("mousemove", (e) => {
      if (!mouseDownActive) return;
      const norm = clientToNorm(e.clientX, e.clientY);
      if (norm) sendMsg({ type: "mouse_move", x: norm.x, y: norm.y });
    });
    window.addEventListener("mouseup", (e) => {
      if (!mouseDownActive) return;
      mouseDownActive = false;
      const norm = clientToNorm(e.clientX, e.clientY) || { x: 0.5, y: 0.5 };
      sendMsg({ type: "mouse_up", x: norm.x, y: norm.y, button: "left" });
    });
    stage.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const norm = clientToNorm(e.clientX, e.clientY);
      if (norm) {
        sendMsg({ type: "click", x: norm.x, y: norm.y, button: "right" });
        showRipple(e.clientX, e.clientY, true);
      }
    });
    stage.addEventListener("wheel", (e) => {
      e.preventDefault();
      const norm = clientToNorm(e.clientX, e.clientY);
      if (!norm) return;
      const delta = e.deltaY < 0 ? 1 : -1;
      sendMsg({ type: "scroll", x: norm.x, y: norm.y, delta });
    }, { passive: false });

    connectWs();
  </script>
</body>
</html>
